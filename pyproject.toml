[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerfight-bot"
version = "2.0.0"
description = "Bot autónomo de Texas Hold'em No-Limit para PokerFight 2026 (política v2)"
requires-python = ">=3.12"
dependencies = ["eval7==0.1.11", "pokerkit==0.7.7"]

[tool.setuptools.packages.find]
include = ["pokerfight*"]
